services:
  - type: web
    name: ai-career-connect
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MISTRAL_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: RENDER
        value: "true"
